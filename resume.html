<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>個人簡歷</title><link rel="stylesheet" href="style.css?v=resume-2"><link rel="stylesheet" href="interior-layout.css?v=2"></head>
<body class="resume-page"><div class="page">
  <header><a class="brand" href="index.html">路線圖 <span>PERSONAL MAP</span></a><nav aria-label="主要導覽"><a href="index.html">首頁</a><a href="resume.html">簡歷</a><a href="career.html">職涯</a><a href="voice.html">聲優</a><a href="bands.html">樂團</a><a href="projects.html">專案</a><a href="ramen.html">拉麵</a></nav></header>
  <main class="resume-main">
    <a class="resume-home-link" href="index.html">← 回到首頁路線圖</a>
    <section class="resume-hero"><p class="mono">PROFILE / RESUME</p><h1 id="resume-name"></h1><p class="resume-role" id="resume-role"></p><p class="resume-lead" id="resume-lead"></p><p class="resume-intro" id="resume-intro"></p><dl class="resume-facts"><div><dt>地點</dt><dd id="resume-location"></dd></div><div><dt>學歷</dt><dd id="resume-education"></dd></div><div><dt>聯絡</dt><dd id="resume-email"></dd></div></dl></section>
    <section class="resume-section"><p class="mono">EXPERIENCE</p><h2>經歷</h2><div id="resume-experience" class="resume-experience"></div></section>
    <section class="resume-section"><p class="mono">CAPABILITIES</p><h2>專長與工具</h2><div id="resume-capabilities" class="resume-capabilities"></div></section>
    <section class="resume-section"><p class="mono">MILESTONES</p><h2>學習與目標</h2><div id="resume-milestones" class="resume-milestones"></div></section>
    <p class="resume-approach" id="resume-approach"></p>
  </main>
  <footer><a href="index.html">← 回到首頁</a><span>PERSONAL WEBSITE</span></footer>
</div>
<script src="content.js?v=profile-2"></script><script>
  const data = window.PORTFOLIO;
  const put = (id, value) => { const node = document.getElementById(id); if (node && value) node.textContent = value; };
  if (data) {
    document.title = `${data.name} | 個人簡歷`;
    put('resume-name', data.name); put('resume-role', data.role); put('resume-lead', data.lead); put('resume-intro', data.intro);
    put('resume-location', data.location); put('resume-education', data.education); put('resume-approach', data.approach);
    if (data.links?.email) { const email = document.createElement('a'); email.href = `mailto:${encodeURIComponent(data.links.email)}`; email.textContent = data.links.email; document.getElementById('resume-email').append(email); }
    for (const item of data.experience || []) { const article = document.createElement('article'); article.innerHTML = `<span>${item.number || ''}</span><div><h3></h3><small></small><p></p></div>`; article.querySelector('h3').textContent = item.title; article.querySelector('small').textContent = item.type; article.querySelector('p').textContent = item.description; document.getElementById('resume-experience').append(article); }
    for (const item of data.capabilities || []) { const card = document.createElement('div'); card.innerHTML = '<small></small><strong></strong>'; card.querySelector('small').textContent = item.label; card.querySelector('strong').textContent = item.value; document.getElementById('resume-capabilities').append(card); }
    for (const item of data.milestones || []) { const entry = document.createElement('article'); entry.innerHTML = '<span></span><div><h3></h3><p></p></div>'; entry.querySelector('span').textContent = item.year; entry.querySelector('h3').textContent = item.title; entry.querySelector('p').textContent = item.text; document.getElementById('resume-milestones').append(entry); }
  }
</script><script src="pages.js?v=motion-2"></script><script src="bands-player.js?v=music-4" defer></script><script src="navigation.js?v=3" defer></script>
</body></html>
